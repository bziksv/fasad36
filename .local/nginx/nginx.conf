worker_processes  1;
error_log  RUN_DIR/nginx-error.log;
pid        RUN_DIR/nginx.pid;

events {
    worker_connections  256;
}

http {
    include       /opt/homebrew/etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout  65;
    gzip  on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    server {
        listen       8094;
        server_name  localhost 127.0.0.1 fasad36.ru;
        root         SITE_ROOT;
        index        index.php index.html;
        client_max_body_size 64m;

        # Apache .htaccess Redirect → nginx (price menus → PDF)
        location = /price/prajs-bolars/ {
            return 301 /upload/price/Price_R_BOLARS_01.06.23.pdf;
        }
        location = /price/Prajs-klei/ {
            return 301 /upload/price/Price_R_%D0%9A%D0%9B%D0%95%D0%98%20%D0%94%D0%9B%D0%AF%20%D0%A3%D0%A2%D0%95%D0%9F%D0%9B%D0%95%D0%9D%D0%98%D0%AF_01.06.23.pdf;
        }
        location = /price/Prajs-UTEPLITELI/ {
            return 301 /upload/price/price-r-utepliteli_01.07.23.pdf;
        }
        location = /price/Prajs-dyubeli/ {
            return 301 /upload/price/Price_R_%D0%A1%D0%A2%D0%95%D0%9A%D0%9B%D0%9E%D0%A1%D0%95%D0%A2%D0%9A%D0%98_%D0%94%D0%AE%D0%91%D0%95%D0%9B%D0%98_%D0%9F%D0%9E%D0%93%D0%9E%D0%9D%D0%90%D0%96_01.06.23.pdf;
        }
        location = /price/Prajs-farbe/ {
            return 301 /upload/%D0%9F%D1%80%D0%B0%D0%B9%D1%81_%D0%A2%D0%B5%D1%80%D0%BC%D0%BE%D1%84%D0%B0%D1%81%D0%B0%D0%B4_FARBE_01.04.2017.pdf;
        }
        location = /catalog/shtukaturka-koroed/ {
            return 301 /catalog/koroed/;
        }

        location / {
            try_files $uri $uri/ @bitrix;
        }

        location @bitrix {
            include        /opt/homebrew/etc/nginx/fastcgi_params;
            fastcgi_pass   127.0.0.1:9094;
            fastcgi_param  SCRIPT_FILENAME $document_root/bitrix/urlrewrite.php;
            fastcgi_read_timeout 300;
        }

        location ~ \.php$ {
            try_files $uri =404;
            include        /opt/homebrew/etc/nginx/fastcgi_params;
            fastcgi_pass   127.0.0.1:9094;
            fastcgi_index  index.php;
            fastcgi_param  SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_read_timeout 300;
        }

        location ~* (^|/)\.(git|env|htaccess|DS_Store)$ {
            deny all;
        }
    }
}
